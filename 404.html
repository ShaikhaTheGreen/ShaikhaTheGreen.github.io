<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Not found — Dr. Shaikhah Alkhadhr</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .err-wrap {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }
    .err-code {
      font-family: var(--font-serif);
      font-size: clamp(5rem, 18vw, 10rem);
      line-height: 1;
      margin: 0 0 12px;
      color: var(--navy);
      letter-spacing: -0.04em;
      font-weight: 500;
    }
    .err-msg { color: var(--ink-mute); margin-bottom: 28px; }
  </style>
</head>
<body>
  <div class="err-wrap">
    <div>
      <p class="err-code">404</p>
      <h2>This page isn't here.</h2>
      <p class="err-msg">It may have moved, or it never existed. Let's go back.</p>
      <a class="btn btn-primary" href="/">Return home</a>
    </div>
  </div>
</body>
</html>
